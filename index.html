<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title> 논단군 스크립트 정리 (Script Console)</title>
    <style>
        /* Notion Dark Mode Premium Theme */
        :root {
            --bg-main: #191919;
            --bg-surface: #202020;
            --bg-input: #252525;
            --border-notion: rgba(255, 255, 255, 0.07);
            --text-main: rgba(255, 255, 255, 0.85);
            --text-muted: rgba(255, 255, 255, 0.4);
            
            /* 요청하신 색상 가이드 반영 (Soft Notion Tone) */
            --bg-kp: rgba(28, 131, 100, 0.15); /* 초록 */
            --text-kp: #4ade80;
            
            --bg-check: rgba(239, 68, 68, 0.15); /* 빨간 */
            --text-check: #f87171;
            
            --bg-handout: rgba(234, 179, 8, 0.12); /* 노란 */
            --text-handout: #fde047;
            
            --bg-link: rgba(59, 130, 246, 0.15); /* 파란 */
            --text-link: #60a5fa;
            
            --bg-copied: rgba(46, 170, 220, 0.15);
        }

        body {
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
            background-color: var(--bg-main);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.01em;
        }

        header {
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            margin: 0 0 6px 0;
            letter-spacing: -0.03em;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
        }

        .notion-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-notion);
            border-radius: 6px;
            padding: 26px;
            margin-bottom: 24px;
        }

        .notion-label {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 14px;
            color: var(--text-muted);
        }

        /* 미니멀 탭 메뉴 */
        .notion-tabs {
            display: flex;
            gap: 6px;
            border-bottom: 1px solid var(--border-notion);
            margin-bottom: 22px;
            padding-bottom: 6px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.1s ease;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
        }

        .tab-btn.active {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.06);
            font-weight: 600;
        }

        /* 그리드 레이아웃 */
        .name-grid {
            display: grid;
            gap: 14px;
            margin-bottom: 18px;
        }
        
        .grid-tyeman {
            grid-template-columns: repeat(2, 1fr);
        }

        .grid-multi {
            grid-template-columns: repeat(4, 1fr);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group span {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .hidden {
            display: none !important;
        }

        input[type="text"], textarea {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-notion);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 0.9rem;
            padding: 10px 14px;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
            transition: border 0.15s ease;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: rgba(255, 255, 255, 0.18);
        }

        textarea {
            height: 180px;
            resize: vertical;
            line-height: 1.6;
        }

        .notion-btn {
            background: none;
            border: 1px solid var(--border-notion);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.12s ease;
        }

        .notion-btn:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .btn-submit {
            width: 100%;
            margin-top: 14px;
            background: rgba(255, 255, 255, 0.02);
            font-weight: 600;
            border-color: rgba(255, 255, 255, 0.1);
        }
        .btn-submit:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        /* 세련된 노션 한 줄 블록 디자인 */
        .notion-row {
            display: flex;
            align-items: stretch;
            gap: 8px;
            margin-bottom: 2px;
        }

        .notion-block {
            flex: 1;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            line-height: 1.6;
            word-break: break-all;
            outline: none;
            color: var(--text-main);
            transition: background 0.1s ease;
        }
        
        .notion-block:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        /* 하이라이트 상태 클래스 */
        .state-copied {
            background-color: var(--bg-copied) !important;
        }

        .state-kp {
            background-color: var(--bg-kp);
            color: var(--text-kp);
        }
        .state-kp:hover { background-color: rgba(28, 131, 100, 0.22); }

        .state-check {
            background-color: var(--bg-check);
            color: var(--text-check);
        }
        .state-check:hover { background-color: rgba(239, 68, 68, 0.22); }

        .state-handout {
            background-color: var(--bg-handout);
            color: var(--text-handout);
        }
        .state-handout:hover { background-color: rgba(234, 179, 8, 0.18); }

        .state-link {
            background-color: var(--bg-link);
            color: var(--text-link);
        }
        .state-link:hover { background-color: rgba(59, 130, 246, 0.22); }

        /* 미니멀 컨트롤 버튼 */
        .row-control {
            padding: 0 8px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            opacity: 0;
            transition: opacity 0.1s ease, color 0.1s ease;
        }
        .notion-row:hover .row-control {
            opacity: 0.4;
        }
        .notion-row:hover .row-control:hover {
            opacity: 1;
        }
        .control-edit:hover { color: var(--text-link); background: rgba(255,255,255,0.02); }
        .control-del:hover { color: #f87171; background: rgba(248, 113, 113, 0.03); }

        .state-editing {
            background: #1c212c !important;
            box-shadow: inset 0 0 0 1px #529cca;
            cursor: text;
        }
    </style>
</head>
<body>

    <header>
        <h1>스크립트 콘솔</h1>
        <p>TRPG 텍스트 자동 변환 및 문장 분할 시스템</p>
    </header>

    <div class="notion-card">
        <div class="notion-label">시나리오 엔진 설정</div>
        
        <div class="notion-tabs">
            <button class="tab-btn active" onclick="switchMode('tyeman')">타이만 모드 (1:1)</button>
            <button class="tab-btn" onclick="switchMode('multi')">다인 모드 (Multi)</button>
        </div>

        <div id="panelTyeman" class="name-grid grid-tyeman">
            <div class="input-group">
                <span>KPC 이름</span>
                <input type="text" id="kpcInput" placeholder="KPC 치환 이름 입력">
            </div>
            <div class="input-group">
                <span>PC / 탐사자 이름</span>
                <input type="text" id="pcInput" placeholder="PC 치환 이름 입력">
            </div>
        </div>

        <div id="panelMulti" class="hidden">
            <div class="name-grid grid-multi">
                <div class="input-group"><span>HO1 / PC1</span><input type="text" id="ch1Input" placeholder="1번 캐릭터 이름"></div>
                <div class="input-group"><span>HO2 / PC2</span><input type="text" id="ch2Input" placeholder="2번 캐릭터 이름"></div>
                <div class="input-group"><span>HO3 / PC3</span><input type="text" id="ch3Input" placeholder="3번 캐릭터 이름"></div>
                <div class="input-group"><span>HO4 / PC4</span><input type="text" id="ch4Input" placeholder="4번 캐릭터 이름"></div>
            </div>
        </div>

        <textarea id="rawScript" placeholder="여기에 변환할 원본 스크립트를 붙여넣으세요..."></textarea>
        <button id="submitBtn" class="notion-btn btn-submit">스크립트 변환 및 실행</button>
    </div>

    <div class="notion-card">
        <div class="panel-header">
            <div class="notion-label" style="margin: 0;">출력된 스크립트 블록</div>
            <button id="copyAllBtn" class="notion-btn" style="padding: 6px 14px; font-size: 0.8rem;">전체 복사</button>
        </div>
        
        <div id="resultContainer">
            <div style="color: var(--text-muted); padding: 15px 0; font-size: 0.9rem;">변환된 텍스트가 없습니다.</div>
        </div>
    </div>

    <textarea id="hiddenClipboard" style="position:fixed; top:-9999px; left:-9999px;"></textarea>

    <script>
        let currentMode = 'tyeman';

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (mode === 'tyeman') {
                document.getElementById('panelTyeman').classList.remove('hidden');
                document.getElementById('panelMulti').classList.add('hidden');
            } else {
                document.getElementById('panelTyeman').classList.add('hidden');
                document.getElementById('panelMulti').classList.remove('hidden');
            }
        }

        function hasBatchim(word) {
            if (!word) return false;
            const lastChar = word.charCodeAt(word.length - 1);
            if (lastChar < 0xAC00 || lastChar > 0xD7A3) return false;
            return (lastChar - 0xAC00) % 28 !== 0;
        }

        function fixKoreanJosa(text, name) {
            if (!name) return text;
            const batchim = hasBatchim(name);
            const josaPairs = [
                { pattern: /(이|가)/g, yes: '이', no: '가' },
                { pattern: /(은|는)/g, yes: '은', no: '는' },
                { pattern: /(을|를)/g, yes: '을', no: '를' },
                { pattern: /(과|와)/g, yes: '과', no: '와' },
                { pattern: /(랑|이랑)/g, yes: '이랑', no: '랑' },
                { pattern: /(으로|로)/g, yes: '으로', no: '로' }
            ];
            let fixed = text;
            josaPairs.forEach(pair => {
                const regex = new RegExp(name + pair.pattern.source, 'g');
                fixed = fixed.replace(regex, (match, p1) => name + (batchim ? pair.yes : pair.no));
            });
            return fixed;
        }

        document.getElementById('submitBtn').addEventListener('click', function() {
            const rawScript = document.getElementById('rawScript').value;
            const container = document.getElementById('resultContainer');
            
            if (!rawScript.trim()) return;

            container.innerHTML = '<div style="color: var(--text-muted); font-size: 0.9rem;">데이터 변환 중...</div>';

            let fixedText = rawScript;

            if (currentMode === 'tyeman') {
                const kpcName = document.getElementById('kpcInput').value.trim();
                const pcName = document.getElementById('pcInput').value.trim();
                
                if (kpcName) {
                    fixedText = fixedText.split('KPC').join(kpcName);
                    fixedText = fixKoreanJosa(fixedText, kpcName);
                }
                if (pcName) {
                    fixedText = fixedText.split('탐사자').join(pcName);
                    fixedText = fixedText.split('PC').join(pcName); 
                    fixedText = fixKoreanJosa(fixedText, pcName);
                }
            } else {
                const replaceTargets = [
                    { id: 'ch1Input', keywords: ['HO1', 'ho1', '핸드아웃1', 'PC1', 'pc1', '탐사자1'] },
                    { id: 'ch2Input', keywords: ['HO2', 'ho2', '핸드아웃2', 'PC2', 'pc2', '탐사자2'] },
                    { id: 'ch3Input', keywords: ['HO3', 'ho3', '핸드아웃3', 'PC3', 'pc3', '탐사자3'] },
                    { id: 'ch4Input', keywords: ['HO4', 'ho4', '핸드아웃4', 'PC4', 'pc4', '탐사자4'] }
                ];

                replaceTargets.forEach(target => {
                    const customName = document.getElementById(target.id).value.trim();
                    if (customName) {
                        target.keywords.forEach(keyword => {
                            fixedText = fixedText.split(keyword).join(customName);
                        });
                        fixedText = fixKoreanJosa(fixedText, customName);
                    }
                });
            }

            const rawLines = fixedText.split('\n');
            const finalLines = [];

            rawLines.forEach(line => {
                const trimmedLine = line.trim();
                if (!trimmedLine) return;

                const isKpLine = trimmedLine.includes('키퍼 정보') || 
                                 trimmedLine.includes('키퍼') || 
                                 trimmedLine.includes('KP') || 
                                 trimmedLine.includes('kp') || 
                                 trimmedLine.includes('Kp');

                const isHandoutLine = trimmedLine.includes('핸드아웃') || 
                                      trimmedLine.includes('비밀번호') || 
                                      trimmedLine.includes('Handout') || 
                                      trimmedLine.includes('handout');

                if (isKpLine || isHandoutLine) {
                    finalLines.push(trimmedLine);
                } else {
                    let subText = trimmedLine;
                    const safeBlocks = [];

                    subText = subText.replace(/(\d+)\.\s/g, (match) => {
                        const id = ` __SAFE_BLOCK_${safeBlocks.length}__ `;
                        safeBlocks.push(match);
                        return id;
                    });

                    subText = subText.replace(/(https?:\/\/[^\s]+)/g, (match) => {
                        const id = `__SAFE_BLOCK_${safeBlocks.length}__`;
                        safeBlocks.push(match);
                        return id;
                    });

                    const quotePatterns = [
                        /“([^”\n]*)”/g, /"([^"\n]*)"/g,
                        /‘([^’\n]*)’/g, /'([^'\n]*)'/g,
                        /\(([^)\n]*)\)/g, /\[([^\]\n]*)\]/g,
                        /「([^」\n]*)」/g, /『([^』\n]*)』/g
                    ];

                    quotePatterns.forEach(pattern => {
                        subText = subText.replace(pattern, (match) => {
                            const id = `__SAFE_BLOCK_${safeBlocks.length}__`;
                            safeBlocks.push(match);
                            return id;
                        });
                    });

                    const splitRegex = /(?<=[.!?]|\.{3,}|…|⋯+)\s+/g;
                    const parts = subText.split(splitRegex);
                    
                    parts.forEach(part => {
                        let chunk = part.trim();
                        if (chunk) {
                            for (let i = safeBlocks.length - 1; i >= 0; i--) {
                                chunk = chunk.split(`__SAFE_BLOCK_${i}__`).join(safeBlocks[i]);
                            }
                            finalLines.push(chunk);
                        }
                    });
                }
            });

            const fragment = document.createDocumentFragment();

            finalLines.forEach(lineText => {
                const wrapper = document.createElement('div');
                wrapper.className = 'notion-row';

                const mainBlock = document.createElement('div');
                mainBlock.className = 'notion-block';
                mainBlock.innerText = lineText;

                const isUrl = lineText.includes('http://') || lineText.includes('https://') ||
                              lineText.includes('BGM') || lineText.includes('bgm') || lineText.includes('브금');
                const isKp = lineText.includes('키퍼 정보') || lineText.includes('키퍼') || lineText.includes('KP') || lineText.includes('kp') || lineText.includes('Kp');
                const isHandout = lineText.includes('핸드아웃') || lineText.includes('비밀번호') || lineText.includes('Handout') || lineText.includes('handout');
                const isCheckLine = lineText.includes('판정');

                if (isKp) {
                    mainBlock.classList.add('state-kp');
                } else if (isCheckLine) {
                    mainBlock.classList.add('state-check');
                } else if (isHandout) {
                    mainBlock.classList.add('state-handout');
                } else if (isUrl) {
                    mainBlock.classList.add('state-link');
                }

                mainBlock.onclick = function() {
                    if (mainBlock.classList.contains('state-editing')) return;
                    executeCopy(mainBlock.innerText, mainBlock);
                };

                const editBtn = document.createElement('button');
                editBtn.className = 'row-control control-edit';
                editBtn.innerText = '수정';
                editBtn.onclick = function() {
                    if (!mainBlock.classList.contains('state-editing')) {
                        mainBlock.contentEditable = true;
                        mainBlock.classList.add('state-editing');
                        editBtn.innerText = '저장';
                        mainBlock.focus();
                    } else {
                        mainBlock.contentEditable = false;
                        mainBlock.classList.remove('state-editing');
                        editBtn.innerText = '수정';
                    }
                };

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'row-control control-del';
                deleteBtn.innerText = '삭제';
                deleteBtn.onclick = function() {
                    wrapper.remove();
                    if (container.children.length === 0) {
                        container.innerHTML = '<div style="color: var(--text-muted); font-size: 0.9rem;">남은 문장이 없습니다.</div>';
                    }
                };

                wrapper.appendChild(mainBlock);
                wrapper.appendChild(editBtn);
                wrapper.appendChild(deleteBtn);
                fragment.appendChild(wrapper);
            });

            container.innerHTML = ''; 
            container.appendChild(fragment);
        });

        document.getElementById('copyAllBtn').addEventListener('click', function() {
            const lines = document.querySelectorAll('.notion-block');
            if (lines.length === 0) return;
            const allTextArray = [];
            lines.forEach(line => allTextArray.push(line.innerText));
            const combinedText = allTextArray.join('\n');
            const btn = document.getElementById('copyAllBtn');
            executeCopy(combinedText, btn, "복사 완료!");
            setTimeout(() => { btn.innerText = "전체 복사"; }, 1000);
        });

        function executeCopy(text, targetElement, successMessage = null) {
            const hiddenArea = document.getElementById('hiddenClipboard');
            hiddenArea.value = text;
            hiddenArea.select();
            try {
                document.execCommand('copy');
                if(successMessage) {
                    targetElement.innerText = successMessage;
                } else {
                    targetElement.classList.add('state-copied');
                    setTimeout(() => targetElement.classList.remove('state-copied'), 400);
                }
            } catch (err) {
                console.error('Copy restriction');
            }
        }
    </script>
</body>
</html>ㅠ
