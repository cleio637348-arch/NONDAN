<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>논단군 스크립트 정리</title>
    <style>
        /* Notion Dark Mode Premium Theme */
        :root {
            --bg-main: #191919;
            --bg-surface: #202020;
            --bg-input: #252525;
            --border-notion: rgba(255, 255, 255, 0.07);
            --text-main: rgba(255, 255, 255, 0.85);
            --text-muted: rgba(255, 255, 255, 0.4);
            
            /* 하이라이트 컬러 (Soft Notion Tone) */
            --bg-kp: rgba(28, 131, 100, 0.15); 
            --text-kp: #4ade80;
            
            --bg-check: rgba(239, 68, 68, 0.15); 
            --text-check: #f87171;
            
            --bg-handout: rgba(234, 179, 8, 0.12); 
            --text-handout: #fde047;
            
            --bg-link: rgba(59, 130, 246, 0.15); 
            --text-link: #60a5fa;
            
            --bg-copied: rgba(46, 170, 220, 0.25);
        }

        body {
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 16px;
            background-color: var(--bg-main);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.01em;
        }

        header {
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            margin: 0 0 6px 0;
            letter-spacing: -0.03em;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0;
        }

        .notion-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-notion);
            border-radius: 6px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .notion-label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            color: var(--text-muted);
        }

        .notion-tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--border-notion);
            margin-bottom: 18px;
            padding-bottom: 4px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .tab-btn.active {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.06);
            font-weight: 600;
        }

        .name-panel {
            margin-bottom: 16px;
        }

        .name-grid {
            display: grid;
            gap: 12px;
        }
        
        .grid-tyeman { grid-template-columns: repeat(2, 1fr); }
        .grid-multi { grid-template-columns: repeat(2, 1fr); }
        
        @media (max-width: 480px) {
            .grid-tyeman { grid-template-columns: 1fr; }
            .grid-multi { grid-template-columns: 1fr; }
        }
        @media (min-width: 768px) {
            .grid-multi { grid-template-columns: repeat(4, 1fr); }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group span {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .hidden {
            display: none !important;
        }

        input[type="text"], textarea {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-notion);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 0.9rem;
            padding: 10px 12px;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
            -webkit-appearance: none;
        }

        textarea {
            height: 150px;
            resize: vertical;
            line-height: 1.6;
            margin-bottom: 14px;
        }

        .translate-option-box {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            font-size: 0.85rem;
            color: var(--text-main);
            cursor: pointer;
            user-select: none;
        }

        .translate-option-box input[type="checkbox"] {
            accent-color: var(--text-kp);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 12px;
        }

        .notion-btn {
            background: none;
            border: 1px solid var(--border-notion);
            color: var(--text-main);
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.1s;
        }

        .btn-submit {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            font-weight: 600;
            padding: 12px;
            font-size: 0.85rem;
        }

        .btn-clear {
            flex: none;
            width: auto;
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.15);
            background: rgba(239, 68, 68, 0.03);
            font-weight: 500;
            padding: 12px 14px;
            font-size: 0.85rem;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .notion-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            padding-bottom: 2px;
        }

        .notion-block {
            flex: 1;
            padding: 10px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            line-height: 1.5;
            word-break: break-all;
            outline: none;
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
        }

        .state-copied { background-color: var(--bg-copied) !important; }
        .state-kp { background-color: var(--bg-kp); color: var(--text-kp); }
        .state-check { background-color: var(--bg-check); color: var(--text-check); }
        .state-handout { background-color: var(--bg-handout); color: var(--text-handout); }
        .state-link { background-color: var(--bg-link); color: var(--text-link); }

        .row-control {
            padding: 8px 10px;
            border: 1px solid var(--border-notion);
            background: rgba(255,255,255,0.02);
            color: var(--text-muted);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }
        
        .control-edit { color: var(--text-link); }
        .control-del { color: #f87171; }

        .state-editing {
            background: #1c212c !important;
            box-shadow: inset 0 0 0 1px #529cca;
            cursor: text;
        }

        .loading-text {
            color: var(--text-handout);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            padding: 30px 0;
            text-align: center;
            animation: blinker 1.2s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <header>
        <h1>논단군 스크립트 정리</h1>
        <p>TRPG 텍스트 자동 정리 시스템</p>
    </header>

    <div class="notion-card">
        <div class="notion-label">모드 설정</div>
        
        <div class="notion-tabs">
            <button id="tabTyeman" class="tab-btn active" onclick="switchMode('tyeman')">타이만 모드</button>
            <button id="tabMulti" class="tab-btn" onclick="switchMode('multi')">다인 모드</button>
        </div>

        <div id="panelTyeman" class="name-panel">
            <div class="name-grid grid-tyeman">
                <div class="input-group">
                    <span>KPC 이름</span>
                    <input type="text" id="kpcInput" placeholder="KPC 이름">
                </div>
                <div class="input-group">
                    <span>PC / 탐사자 이름</span>
                    <input type="text" id="pcInput" placeholder="PC 이름">
                </div>
            </div>
        </div>

        <div id="panelMulti" class="name-panel hidden">
            <div class="name-grid grid-multi">
                <div class="input-group"><span>HO1</span><input type="text" id="ch1Input" placeholder="1번 이름"></div>
                <div class="input-group"><span>HO2</span><input type="text" id="ch2Input" placeholder="2번 이름"></div>
                <div class="input-group"><span>HO3</span><input type="text" id="ch3Input" placeholder="3번 이름"></div>
                <div class="input-group"><span>HO4</span><input type="text" id="ch4Input" placeholder="4번 이름"></div>
            </div>
        </div>

        <textarea id="rawScript" placeholder="텍스트를 붙여넣으세요. PDF 긁어오기 줄바꿈 보정, 숫자 번호 및 단문 쉼표 보호 기능이 자동으로 동작합니다."></textarea>
        
        <label class="translate-option-box">
            <input type="checkbox" id="jpTranslateOpt">
            <span>일본어 자동 번역</span>
        </label>

        <div class="btn-group">
            <button id="clearBtn" class="notion-btn btn-clear">초기화</button>
            <button id="submitBtn" class="notion-btn btn-submit">실행</button>
        </div>
    </div>

    <div class="notion-card">
        <div class="panel-header">
            <div class="notion-label" style="margin: 0;">출력된 스크립트 블록</div>
            <button id="copyAllBtn" class="notion-btn" style="padding: 6px 12px; font-size: 0.8rem;">전체 복사</button>
        </div>
        
        <div id="resultContainer">
            <div style="color: var(--text-muted); padding: 15px 0; font-size: 0.9rem;">변환된 텍스트가 없습니다.</div>
        </div>
    </div>

    <script>
        let currentMode = 'tyeman';

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('tabTyeman').classList.toggle('active', mode === 'tyeman');
            document.getElementById('tabMulti').classList.toggle('active', mode === 'multi');
            document.getElementById('panelTyeman').classList.toggle('hidden', mode !== 'tyeman');
            document.getElementById('panelMulti').classList.toggle('hidden', mode !== 'multi');
        }

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // 구글 번역 연동 API 래퍼 함수
        async function translateTextChunk(text) {
            if (!text.trim()) return text;
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ja&tl=ko&dt=t&q=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                const data = await response.json();
                if (data && data[0]) {
                    let result = "";
                    data[0].forEach(part => { if (part[0]) result += part[0]; });
                    return result;
                }
                return text;
            } catch (error) {
                console.error("번역 에러 발생:", error);
                return text;
            }
        }

        // 한국어 받침 판정 (조사 교정용)
        function hasBatchim(word) {
            if (!word) return false;
            const lastChar = word.charCodeAt(word.length - 1);
            if (lastChar < 0xAC00 || lastChar > 0xD7A3) return false;
            return (lastChar - 0xAC00) % 28 !== 0;
        }

        // 이름 변환 후 조사가 깨지는 현상 교정 함수
        function fixKoreanJosa(text, name) {
            if (!name) return text;
            const batchim = hasBatchim(name);
            const josaPairs = [
                { pattern: /(이|가)/g, yes: '이', no: '가' },
                { pattern: /(은|는)/g, yes: '은', no: '는' },
                { pattern: /(을|를)/g, yes: '을', no: '를' },
                { pattern: /(과|와)/g, yes: '과', no: '와' },
                { pattern: /(랑|이랑)/g, yes: '이랑', no: '랑' },
                { pattern: /(으로|로)/g, yes: '으로', no: '로' }
            ];
            let fixed = text;
            josaPairs.forEach(pair => {
                const escapedName = name.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                const regex = new RegExp(escapedName + pair.pattern.source, 'g');
                fixed = fixed.replace(regex, () => name + (batchim ? pair.yes : pair.no));
            });
            return fixed;
        }

        // PDF 임의 줄바꿈 제거 최적화 함수
        function preprocessPDFText(text) {
            let rawLines = text.split('\n');
            const processedLines = [];
            let buffer = "";

            rawLines.forEach(line => {
                let current = line.trim();
                if (!current) return;

                // 특수 키워드 보호 레이어 (줄바꿈 결합 제외)
                const isSpecial = /키퍼|KP|kp|핸드아웃|비밀번호|Handout|http/i.test(current);

                if (isSpecial) {
                    if (buffer) {
                        processedLines.push(buffer.trim());
                        buffer = "";
                    }
                    processedLines.push(current);
                    return;
                }

                if (buffer) {
                    const isEnd = /[.!??”’)\]지역｣』。．]$/.test(buffer.slice(-1));
                    if (!isEnd) {
                        buffer += " " + current; // 문장 종결 기호가 아니면 이어 붙이기
                    } else {
                        processedLines.push(buffer.trim());
                        buffer = current;
                    }
                } else {
                    buffer = current;
                }
            });

            if (buffer) processedLines.push(buffer.trim());
            return processedLines.join('\n');
        }

        document.getElementById('clearBtn').addEventListener('click', function() {
            document.getElementById('rawScript').value = '';
            document.getElementById('jpTranslateOpt').checked = false;
        });

        document.getElementById('submitBtn').addEventListener('click', async function() {
            const rawScript = document.getElementById('rawScript').value;
            const container = document.getElementById('resultContainer');
            const isJpMode = document.getElementById('jpTranslateOpt').checked;
            
            if (!rawScript.trim()) return;
            container.innerHTML = '<div class="loading-text" id="loadingProgress">스크립트 변환 중...</div>';

            // [1단계] 이름 대치 엔진 및 조사 교정 실행
            let preProcessedText = rawScript;
            if (currentMode === 'tyeman') {
                const kpcName = document.getElementById('kpcInput').value.trim();
                const pcName = document.getElementById('pcInput').value.trim();
                if (kpcName) { preProcessedText = preProcessedText.split('KPC').join(kpcName); preProcessedText = fixKoreanJosa(preProcessedText, kpcName); }
                if (pcName) { preProcessedText = preProcessedText.replace(/탐사자|PC/g, pcName); preProcessedText = fixKoreanJosa(preProcessedText, pcName); }
            } else {
                const targets = [
                    { id: 'ch1Input', keywords: ['HO1', 'ho1', 'Ho1', '핸드아웃1', 'PC1', 'pc1', '탐사자1'] },
                    { id: 'ch2Input', keywords: ['HO2', 'ho2', 'Ho2', '핸드아웃2', 'PC2', 'pc2', '탐사자2'] },
                    { id: 'ch3Input', keywords: ['HO3', 'ho3', 'Ho3', '핸드아웃3', 'PC3', 'pc3', '탐사자3'] },
                    { id: 'ch4Input', keywords: ['HO4', 'ho4', 'Ho4', '핸드아웃4', 'PC4', 'pc4', '탐사자4'] }
                ];
                targets.forEach(t => {
                    const name = document.getElementById(t.id).value.trim();
                    if (name) { t.keywords.forEach(k => preProcessedText = preProcessedText.split(k).join(name)); preProcessedText = fixKoreanJosa(preProcessedText, name); }
                });
            }

            // [2단계] PDF 최적화 전처리 엔진 통과
            let restoredText = preprocessPDFText(preProcessedText);
            const intermediateLines = [];
            const restoredLines = restoredText.split('\n');

            // [3단계] 정밀 문장 기호 보호막 및 분할 토큰 스트림 엔진
            restoredLines.forEach(line => {
                let trimmed = line.trim();
                if (!trimmed) return;

                if (/키퍼|KP|kp|핸드아웃|비밀번호|Handout|http/i.test(trimmed)) {
                    intermediateLines.push({ text: trimmed.replace(/\s+/g, " "), isSpecial: true });
                } else {
                    // 숫자 뒤 마침표(예: 1., 2.) 완벽 보호 조치 (\u0004 기호로 일시 우회)
                    let protectedText = trimmed.replace(/(\d+)\./g, '$1\u0004');
                    
                    // 대화 내용 및 대괄호/괄호 안 쉼표 보호 처리
                    const quotes = [];
                    const patterns = [ /“[^”]*”/g, /"[^"\n]*"/g, /‘[^’]*’/g, /'[^'\n]*'/g, /\[\[[^\]]*\]\]/g, /\([^)]*\)/g, /\[[^\]]*\]/g, /「[^」]*」/g, /『[^』]*』/g ];
                    patterns.forEach(pattern => {
                        protectedText = protectedText.replace(pattern, (match) => {
                            const safe = match.replace(/,/g, '\u0001').replace(/、/g, '\u0003');
                            quotes.push(safe);
                            return `\u0002_${quotes.length - 1}_\u0002`;
                        });
                    });

                    // 온점/느낌표/물음표 문장 종결자 기준 1차 분산 분할
                    let sentences = protectedText.replace(/([.!?。．]|\.{3,}|…|⋯+)/g, "$1\u0007").split('\u0007');

                    sentences.forEach(sentence => {
                        let currentSentence = sentence.trim();
                        if (!currentSentence) return;

                        // 토큰 스트림 기반 단문(8글자 이하) 쉼표 분리 스킵 처리
                        let tokens = currentSentence.split(/([,、])/);
                        let currentChunk = "";
                        let segmentToCheck = "";

                        for (let t = 0; t < tokens.length; t++) {
                            let token = tokens[t];
                            if (token === ',' || token === '、') {
                                // 현재 진행 중인 쉼표 앞 구절의 가상 글자 복원 후 순수 글자 수 계산
                                let checkStr = segmentToCheck;
                                for (let k = 0; k < quotes.length; k++) checkStr = checkStr.split(`\u0002_${k}_\u0002`).join(quotes[k]);
                                checkStr = checkStr.replace(/\u0001/g, ',').replace(/\u0003/g, '、').replace(/\u0004/g, '.').trim();

                                currentChunk += token;
                                
                                // 순수 단문 구절 글자 수가 8글자를 초과할 때만 안전 분리 확정
                                if (checkStr.length > 8) {
                                    let finalChunk = currentChunk;
                                    for (let k = quotes.length - 1; k >= 0; k--) finalChunk = finalChunk.split(`\u0002_${k}_\u0002`).join(quotes[k]);
                                    finalChunk = finalChunk.replace(/\u0001/g, ',').replace(/\u0003/g, '、').replace(/\u0004/g, '.').replace(/\s+/g, " ").trim();
                                    
                                    if (finalChunk) intermediateLines.push({ text: finalChunk, isSpecial: false });
                                    
                                    currentChunk = "";
                                    segmentToCheck = "";
                                } else {
                                    // 8글자 이하 단문 구절이면 다음 구절과 병합, 단 순수 글자 수 계산 버퍼는 리셋
                                    segmentToCheck = "";
                                }
                            } else {
                                currentChunk += token;
                                segmentToCheck += token;
                            }
                        }

                        // 스트림에 남아있는 최종 잔여 조각 마감 처리
                        if (currentChunk.trim()) {
                            let finalChunk = currentChunk;
                            for (let k = quotes.length - 1; k >= 0; k--) finalChunk = finalChunk.split(`\u0002_${k}_\u0002`).join(quotes[k]);
                            finalChunk = finalChunk.replace(/\u0001/g, ',').replace(/\u0003/g, '、').replace(/\u0004/g, '.').replace(/\s+/g, " ").trim();
                            if (finalChunk) intermediateLines.push({ text: finalChunk, isSpecial: false });
                        }
                    });
                }
            });

            // [4단계] 일본어 고정 번역 및 텍스트 누락 방지 안정 제동(Fail-Safe) 레이어
            if (isJpMode) {
                const totalLines = intermediateLines.length;
                const loadingTextEl = document.getElementById('loadingProgress');
                
                let currentChunkText = "";
                let chunkIndices = [];
                const SAFE_LIMIT = 1200; 
                const SEPARATOR = " ▣ "; // 매칭 데이터 유실 차단 목적용 번역 특수 구분자

                for (let i = 0; i < totalLines; i++) {
                    const lineText = intermediateLines[i].text;
                    
                    if ((currentChunkText.length + lineText.length > SAFE_LIMIT && currentChunkText.length > 0) || i === totalLines - 1) {
                        if (i === totalLines - 1) {
                            currentChunkText += (currentChunkText ? SEPARATOR : "") + lineText;
                            chunkIndices.push(i);
                        }

                        loadingTextEl.innerText = `번역 데이터 처리 중... (${i + 1} / ${totalLines})`;

                        const translatedChunk = await translateTextChunk(currentChunkText);
                        const translatedSplit = translatedChunk.split(/▣/g).map(s => s.trim());

                        if (translatedSplit.length === chunkIndices.length) {
                            chunkIndices.forEach((origIdx, chunkSubIdx) => {
                                if (translatedSplit[chunkSubIdx]) intermediateLines[origIdx].text = translatedSplit[chunkSubIdx];
                            });
                        } else {
                            // 문장 개수가 다를 경우 개별 라인 정밀 재번역 레이어로 긴급 자동 우회
                            for (let cIdx of chunkIndices) {
                                intermediateLines[cIdx].text = await translateTextChunk(intermediateLines[cIdx].text);
                                await sleep(50);
                            }
                        }

                        currentChunkText = "";
                        chunkIndices = [];
                        await sleep(200); 
                    }

                    if (i < totalLines - 1) {
                        currentChunkText += (currentChunkText ? SEPARATOR : "") + lineText;
                        chunkIndices.push(i);
                    }
                }
            }

            // 후처리 공백 조사 흡수 
            intermediateLines.forEach(item => {
                item.text = item.text.replace(/([가-힣])\s+(이|가|은|는|을|를|과|와|의|에|에서|고|라고|하며|했습니다|입니다|였다|였습니다)(\s|[,.!?\n]|$)/g, '$1$2$3');
            });

            // [5단계] UI 컴포넌트 렌더링 및 하이라이트 스타일 클래스 바인딩
            const fragment = document.createDocumentFragment();
            intermediateLines.forEach(item => {
                let lineText = item.text.replace(/\s+/g, " ").trim();
                if (!lineText) return;

                const wrapper = document.createElement('div');
                wrapper.className = 'notion-row';

                const mainBlock = document.createElement('div');
                mainBlock.className = 'notion-block';
                mainBlock.innerText = lineText;

                if (/키퍼|KP|kp/i.test(lineText)) mainBlock.classList.add('state-kp');
                else if (lineText.includes('판정')) mainBlock.classList.add('state-check');
                else if (/핸드아웃|비밀번호|Handout/i.test(lineText)) mainBlock.classList.add('state-handout');
                else if (/http|bgm|브금/i.test(lineText)) mainBlock.classList.add('state-link');

                mainBlock.onclick = function() { if (!mainBlock.classList.contains('state-editing')) executeCopy(mainBlock.innerText, mainBlock); };

                const editBtn = document.createElement('button');
                editBtn.className = 'row-control control-edit';
                editBtn.innerText = '수정';
                editBtn.onclick = function() {
                    if (!mainBlock.classList.contains('state-editing')) {
                        mainBlock.contentEditable = true;
                        mainBlock.classList.add('state-editing');
                        editBtn.innerText = '저장';
                        mainBlock.focus();
                    } else {
                        mainBlock.contentEditable = false;
                        mainBlock.classList.remove('state-editing');
                        mainBlock.innerText = mainBlock.innerText.replace(/\s+/g, " ").trim();
                        editBtn.innerText = '수정';
                    }
                };

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'row-control control-del';
                deleteBtn.innerText = '삭제';
                deleteBtn.onclick = function() {
                    wrapper.remove();
                    if (container.children.length === 0) container.innerHTML = '<div style="color: var(--text-muted); font-size: 0.9rem;">남은 문장이 없습니다.</div>';
                };

                wrapper.appendChild(mainBlock); wrapper.appendChild(editBtn); wrapper.appendChild(deleteBtn);
                fragment.appendChild(wrapper);
            });

            container.innerHTML = ''; 
            container.appendChild(fragment);
        });

        document.getElementById('copyAllBtn').addEventListener('click', function() {
            const lines = document.querySelectorAll('.notion-block');
            if (lines.length === 0) return;
            const combinedText = Array.from(lines).map(line => line.innerText).join('\n');
            const btn = document.getElementById('copyAllBtn');
            executeCopy(combinedText, btn, "복사 완료!");
            setTimeout(() => { btn.innerText = "전체 복사"; }, 1000);
        });

        function executeCopy(text, targetElement, msg = null) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => showSuccess(targetElement, msg)).catch(() => fallbackCopy(text, targetElement, msg));
            } else fallbackCopy(text, targetElement, msg);
        }

        function fallbackCopy(text, targetElement, msg) {
            const hiddenArea = document.createElement('textarea');
            hiddenArea.value = text;
            hiddenArea.style.position = 'fixed'; hiddenArea.style.top = '-9999px';
            document.body.appendChild(hiddenArea);
            hiddenArea.select();
            try { document.execCommand('copy'); showSuccess(targetElement, msg); } catch (err) { console.error('복사 실패'); }
            document.body.removeChild(hiddenArea);
        }

        function showSuccess(el, msg) {
            if(msg) el.innerText = msg;
            else { el.classList.add('state-copied'); setTimeout(() => el.classList.remove('state-copied'), 400); }
        }
    </script>
</body>
</html>
